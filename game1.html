
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de devinette</title>
</head>
<body>

    <h1>Jeu de js</h1>

    <input type="number" id="nombre" placeholder="Entre un nombre">
    <button onclick="verifier()">Vérifier</button>

    <p id="message"></p>

    <script>
        let secret = 7;
        let essais = 0;

        function verifier() {
            let nombre = Number(document.getElementById("nombre").value);

            if (document.getElementById("nombre").value === "") {
                document.getElementById("message").textContent = "Entre un nombre !";
                return;
            }

            essais++;

            if (nombre < secret) {
                document.getElementById("message").textContent = "C'est PLUS grand !";
            } else if (nombre > secret) {
                document.getElementById("message").textContent = "C'est PLUS petit !";
            } else {
                document.getElementById("message").textContent =
                    "Bravo ! Vous avez gagné en " + essais + " essais !";
            }
        }
    </script>

</body>
</html>
